# Cloady build of nanobot. Upstream docker-compose.yml targets a self-managed
# Docker host: it publishes 18790 on the host's loopback and bind-mounts
# ~/.nanobot, neither of which exists on a PaaS (Cloady's compose parser
# rejects "127.0.0.1:18790:18790" outright). This file keeps only the fields
# Cloady's own catalog templates use: image build, command, environment,
# published/exposed ports and a named volume.
#
# shortcut: one gateway service only. Add a nanobot-api service back
# (serve --host 0.0.0.0 -p 8900, published port 8900 + api.apiKey) when the
# OpenAI-compatible endpoint must be reachable from outside the app.

services:
  nanobot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Bake the QQ channel's optional dependency (botpy). The remote WebUI
        # cannot install optional packages, and a runtime install would be
        # lost on the next rebuild. Do NOT make this a runtime app variable:
        # nanobot's Config uses env_prefix NANOBOT_, so a runtime
        # NANOBOT_CHANNELS maps onto the whole channels field and breaks
        # first-boot config validation.
        NANOBOT_CHANNELS: "qq"
    command: ["gateway"]
    environment:
      # First boot writes config.json into the volume with gateway and
      # websocket bound to 0.0.0.0, plus the WebUI credentials below.
      NANOBOT_DOCKER_BOOTSTRAP: "1"
      NANOBOT_WEB_TOKEN: ${NANOBOT_WEB_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      # WebUI + WebSocket channel; becomes the app's https/wss hostname.
      - 8765
    expose:
      # Gateway health. Unauthenticated, so it stays internal.
      - "18790"
    volumes:
      - home:/home/nanobot/.nanobot
    deploy:
      resources:
        # Matches upstream's per-service ceiling and stays inside Cloady's free
        # allowance (0.5 vCPU / 1 GB / 5 GB). Raise with a paid plan if the
        # gateway hits its memory limit.
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 1G

volumes:
  # Sessions, memory, cron state, media and config. Grows but never shrinks.
  home:
    driver_opts:
      size: 4Gi
